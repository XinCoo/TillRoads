name: Schema CI

# ---------------------------------------------------------------------------
# 用途: 在 GitHub Actions 的临时 PostgreSQL 15 服务容器里「真跑」schema。
#   验证范围 = 建表 + 二次执行幂等 + down/up 可逆 + 末尾自检 DO 块通过。
#   **不是**业务语义验证: 状态机 / 禁用语 / 三次验证 / 去重哈希等业务规则
#   **不是**业务语义验证: 状态机 / 禁用语 / 三次验证 / 去重哈希等业务规则
#   由下方 node-tests job 的 Node 单测(core/ + server/)覆盖, 本 schema job 不重复。
# ---------------------------------------------------------------------------
on:
  push:
    paths:
      - 'schema.sql'
      - 'migrations/**'
      - '.github/workflows/schema-ci.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'core/**'
      - 'server/**'
  pull_request:
    paths:
      - 'schema.sql'
      - 'migrations/**'
      - '.github/workflows/schema-ci.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'core/**'
      - 'server/**'

jobs:
  schema:
    name: PG15 · up / idempotent / reversible
    runs-on: ubuntu-24.04  # 固定 LTS 镜像: ubuntu-latest 自 2026-10-19 起迁移到 Ubuntu 26, 避免 runner 镜像漂移

    # 一次性占位凭据(仅用于本次服务容器); 非真实密钥, 不写入仓库 Secrets。
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: tillroad_ci
      PGPASSWORD: tillroad_ci_pw
      PGDATABASE: tillroad_ci

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: tillroad_ci
          POSTGRES_PASSWORD: tillroad_ci_pw
          POSTGRES_DB: tillroad_ci
          # 强制 UTF8: schema.sql 的 normalize_question_text() 用 convert_to(s,'UTF8')
          # 且冒烟测试含中文, 若库编码非 UTF8 会误判。
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tillroad_ci -d tillroad_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5  # v5 原生运行在 Node 24, 消除 v4(Node 20) 弃用告警

      - name: Ensure psql client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      # 迁移脚本 migrations/0001_init_up.sql 内部是 `\ir ../schema.sql`
      # (psql \ir 相对「脚本所在目录」解析 -> 仓库根 schema.sql), 故 -f 用仓库根相对路径。
      - name: Up #1 — apply migration (must print SCHEMA_VERIFY_OK)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f migrations/0001_init_up.sql 2>&1 | tee /tmp/up1.log
          grep -q 'SCHEMA_VERIFY_OK' /tmp/up1.log

      - name: Up #2 — re-run the SAME script (二次执行幂等)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f migrations/0001_init_up.sql 2>&1 | tee /tmp/up2.log
          grep -q 'SCHEMA_VERIFY_OK' /tmp/up2.log

      # 可选但推荐: 顺序有依赖 —— 必须先 down 再 up, 不可反过来。
      - name: Down — rollback (可下)
        run: psql -v ON_ERROR_STOP=1 -f migrations/0001_init_down.sql

      - name: Up #3 — re-apply after rollback (可上, down/up 可逆)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f migrations/0001_init_up.sql 2>&1 | tee /tmp/up3.log
          grep -q 'SCHEMA_VERIFY_OK' /tmp/up3.log

  # -------------------------------------------------------------------------
  # BE-01 第 2 步新增: Node 单测 + 一条 PG smoke 集成测试。
  # 与 schema job 用 needs 串联: 先确认 schema 可上/幂等/可逆, 再跑 Node 测试。
  # services 是 job 级作用域(不能跨 job 共享同一容器), 这里复用同一份
  # postgres:15 定义而非另写镜像; smoke 只需一个可连的 PG(SELECT 1 / 类型解析 /
  # 临时表事务), 不需要已迁移的业务库。
  # BE-01 第 3 步: 新增的 repositories.integration.test.mjs 会在 before() 里
  # 直接用 pg 执行整个 schema.sql(单一事实来源, 无 psql 元命令),
  # 故仍不需要跑 psql 迁移脚本 —— 迁移本身已由 needs: schema 的 job 验证过。
  # -------------------------------------------------------------------------
  node-tests:
    name: Node 24 · unit tests + PG integration (smoke + 四表仓储 + 路由层)
    needs: schema
    runs-on: ubuntu-24.04  # 与 schema job 一致, 固定 LTS 镜像

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: tillroad_ci
      PGPASSWORD: tillroad_ci_pw
      PGDATABASE: tillroad_ci
      # 仅本 job 显式打开集成开关; 本机/其它环境默认跳过, 绝不假装跑过 PG。
      RUN_PG_INTEGRATION: '1'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: tillroad_ci
          POSTGRES_PASSWORD: tillroad_ci_pw
          POSTGRES_DB: tillroad_ci
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tillroad_ci -d tillroad_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5  # 与 schema job 一致: Node 24 原生, 无 Node 20 弃用告警

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'   # 依赖 package-lock.json(BE-01 第 2 步已生成, 须随代码提交)

      - name: Install dependencies
        run: npm ci   # 按 lockfile 精确安装, 含 pg@8.23.1

      # services.options 的 health-cmd 已让 GitHub 等容器 healthy 才进入 steps,
      # 故无需额外的 sleep/pg_isready 等待步骤(也避免对 psql 客户端的隐式依赖)。
      # RUN_PG_INTEGRATION=1 已使 skip 条件失效；若 PG 不可连，集成测试的
      # before() 会直接抛错让 job 变红。这里再做一道保险：显式断言
      # skipped=0，避免「全部被跳过也算绿」的假绿。
      - name: Node unit tests + PG integration (smoke + 四表仓储 + 路由层)
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test-output.txt
          # 用 ASCII 串 'skipped 0' 判定，避免解析带 emoji 的报告行在 locale 下不稳定
          if ! grep -q 'skipped 0' /tmp/test-output.txt; then
            echo "::error::存在被跳过的测试，RUN_PG_INTEGRATION 或 PG 连接有问题"
            exit 1
          fi
