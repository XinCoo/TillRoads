name: tillroad_app
description: "题路 TillRoad · 备考闭环管理（首页看板 FE-01）"
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.14.0

# 依赖最小化（FE-01 约束 + FE-03 联调放宽）：
# - 运行时依赖仅两个：cupertino_icons（图标）与 http（FE-03 联调新增，Dart 官方）。
# - 仍不引状态管理库（setState 够用）、不引路由库（Navigator 够用）、
#   不引图表库（缺陷分布条形图用 Container + FractionallySizedBox 手绘）、
#   不引 json_serializable（手写 snake_case 字段映射，见 lib/api/defect_api.dart）。
# - flutter_launcher_icons 仅 dev_dependencies，用于一次性生成各平台图标，不进产物。
# 注: 已移除 `flutter create` 模板默认生成的 material_ui 依赖 —— FE-01 要求 iOS 原生 Cupertino 风格，
#     全部界面使用 lib/ 下的 Cupertino* 组件，不需要 Material。
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # FE-03 联调：唯一新增的运行时依赖。Dart 官方包，无传递依赖负担。
  # 不用 dio 的理由：只有 7 个端点（2 个读 + 5 个写），http 的简单 API 足够；
  # dio 带来的拦截器/取消令牌等能力本轮用不上，不值得多一层抽象。
  http: ^1.2.0
  shared_preferences: ^2.5.3
  share_plus: ^13.3.1

  # 本地优先架构 R1（docs/local-first-design.md §3.0）：
  # sqflite —— 本地 SQLite 的唯一运行时依赖。刻意不引 Drift：Drift 要 5 个包
  # 且必须 build_runner 代码生成，与本工程「手写 snake_case 映射、不引 json_serializable」
  # 的既有取向相反；本项目的本地查询只有十几条简单 SQL，用不到 ORM 的表达力。
  sqflite: ^2.3.0
  # path —— sqflite 拼数据库文件路径用（`join(await getDatabasesPath(), 文件名)`）。
  # 它本来是 flutter_test 的传递依赖，显式声明是因为 lib/ 里直接 import 它。
  path: ^1.9.0

  # m17431（题库导入入口）：唯一新增依赖。
  # file_picker —— 用户从手机「文件」里选 .md/.txt/.csv/.pdf/.xlsx 交给导入管线。
  # 不用 image_picker 的理由：题目文件是文档不是图片；
  # 不用 desktop_drop 的理由：那只管桌面拖放，移动端分发要的是系统文件选择器。
  # 注意版本：任务书建议 ^8.0.0，但 file_picker 8.x 依赖 win32 ^5，
  # 与 share_plus 13.x（win32 ^6）冲突，pub 解析不出来。
  # 这里升到 file_picker 13.x（与 share_plus 13.x 同代 win32），
  # API 形状不变（FilePicker.platform.pickFiles / FilePickerResult.files.first.bytes）。
  file_picker: ^13.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  # sqflite 在 `flutter test` 的宿主环境没有平台实现，必须用 FFI 桥接到宿主的 sqlite3。
  # 仅测试用，绝不进运行时依赖（否则桌面/移动端会各多带一份原生库）。
  sqflite_common_ffi: ^2.3.0

# 图标生成器配置：源图为 1024×1024 PNG（由 12500×12500 毛笔字 logo 裁字形后居中重排得到）
# - app_icon.png            纯白底（无 alpha）→ iOS 不接受带透明通道的图标
# - app_icon_foreground.png 透明底          → Android 自适应图标前景层
flutter_launcher_icons:
  image_path: "assets/icons/app_icon.png"
  android: "launcher_icon"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 256

flutter:
  # 保留 MaterialIcons 字体：本工程不使用任何 Material 组件（界面全 Cupertino），
  # 但 Flutter 在部分基础能力（如调试横幅、部分内部 Icon 回退）仍会查找该字体族，
  # 保留可避免运行时缺字体告警。它只多打包一个字体文件，不引入代码依赖。
  uses-material-design: true

  assets:
    - assets/icons/

  # ── 字体（FE-01 字体接入）───────────────────────────────────────────────
  # 霞鹜新致宋（LXGW Neo ZhiSong），SIL OFL 1.1，可免费商用与嵌入。
  # 只有 Regular 一个字重（OS/2.usWeightClass = 400，无 fvar 表，非可变字体），
  # 因此 fontWeight 500/600/700 会走引擎的合成加粗（faux bold）。
  # 家族名 'LXGWNeoZhiSong' 是 Flutter 侧的注册名，可任意取；
  # 字体文件内部族名实为「霞鹜新致宋 简」，与本处不冲突。
  # 中文文件名用引号包住，YAML 里非 ASCII 路径必须引号才不会踩解析歧义。
  fonts:
    - family: LXGWNeoZhiSong
      fonts:
        - asset: "assets/fonts/霞鹜新致宋字体.ttf"
